<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DevTools Khori">
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0B3D91"/>
  <!-- terminal prompt: chevron + caret, the core "dev tools" mark -->
  <path d="M18 22 L28 32 L18 42" fill="none" stroke="#FFFFFF" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="32" y1="44" x2="46" y2="44" stroke="#FFD23F" stroke-width="5" stroke-linecap="round"/>
  <!-- accessibility dot: focus ring evoking the "eye/person" the portal centers on -->
  <circle cx="44" cy="22" r="6" fill="none" stroke="#FFD23F" stroke-width="3"/>
  <circle cx="44" cy="22" r="1.5" fill="#FFD23F"/>
</svg>
