apiVersion: v1
kind: Namespace
metadata:
  name: devtools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devtools-khori
  namespace: devtools
  labels: { app: devtools-khori }
spec:
  replicas: 2
  selector:
    matchLabels: { app: devtools-khori }
  template:
    metadata:
      labels: { app: devtools-khori }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
        # Allow unprivileged ICMP datagram sockets so `ping` works as non-root
        # without raw-socket capabilities (this is a "safe" sysctl in kubelet).
        sysctls:
          - name: net.ipv4.ping_group_range
            value: "0 2147483647"
      containers:
        - name: web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Injected at runtime (not committed): used to mask the real origin
            # address in ping/traceroute output.
            - name: HOST_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"] # ping / traceroute
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devtools-khori
  namespace: devtools
spec:
  selector: { app: devtools-khori }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devtools-khori
  namespace: devtools
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    # WAF layer at the edge: ModSecurity + OWASP Core Rule Set, scoped to this
    # Ingress only (boolean annotations; no cluster-wide snippet change needed).
    # The shared controller's engine is DetectionOnly, so the CRS audits/logs
    # here while the application-level WAF (server/waf.js) performs blocking.
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: "true"
    # Per-site rate limiting (defense in depth alongside the app limiter).
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["dev.tools.khori.com.br"]
      secretName: devtools-khori-tls
  rules:
    - host: dev.tools.khori.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devtools-khori
                port:
                  number: 80
