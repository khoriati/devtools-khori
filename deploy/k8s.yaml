apiVersion: v1
kind: Namespace
metadata:
  name: devtools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devtools-khori
  namespace: devtools
  labels: { app: devtools-khori }
spec:
  replicas: 2
  selector:
    matchLabels: { app: devtools-khori }
  template:
    metadata:
      labels: { app: devtools-khori }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"] # ping / traceroute
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: devtools-khori
  namespace: devtools
spec:
  selector: { app: devtools-khori }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devtools-khori
  namespace: devtools
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["dev.tools.khori.com.br"]
      secretName: devtools-khori-tls
  rules:
    - host: dev.tools.khori.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devtools-khori
                port:
                  number: 80
